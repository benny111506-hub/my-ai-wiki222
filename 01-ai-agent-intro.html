        <h1>代理型 AI (Agentic AI) 發展與觀念</h1>
        <span class="tag">AI Agent</span> <span class="tag">Harness Engineering</span>
        <div class="content">
            <p>生成式 AI 正從單純的語言接龍模型演進為代理型 AI (Agentic AI)。傳統對話型 AI 像顧問，僅能回答文字；而 Agent 則像員工，具備檔案讀寫與工具操作能力。</p>
            <h3>核心三要素：</h3>
            <ul>
                <li><strong>Model (大腦)</strong>：大型語言模型，負責邏輯思考與任務拆解。</li>
                <li><strong>Harness (裝備)</strong>：包含檔案系統存取、API 介面與命令執行能力。</li>
                <li><strong>Agent SOP (`agent.md`)</strong>：明確的員工手冊，規範流程與驗收標準。</li>
            </ul>
        </div>
    </article>
